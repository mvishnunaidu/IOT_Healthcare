version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare_iot_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./healthcare_iot.db
      - SECRET_KEY=healthcare_iot_secret_key_change_in_production_2026_super_secure
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
